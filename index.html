<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="course-header">
        <span class="course-name">MIS 481</span>
        <span class="assignment-name">Hack 1</span>
    </header>
    <main class="calculator" aria-labelledby="title">
        <h1 id="title">Calculator</h1>

        <div class="screen">
            <p id="expression" class="expression"></p>
            <output id="display" aria-label="Calculator display">0</output>
        </div>

        <div class="keypad">
            <button type="button" class="utility clear" data-key="Escape" aria-label="Clear all">AC</button>
            <button type="button" class="utility" data-key="Backspace" aria-label="Delete last digit">⌫</button>
            <button type="button" class="operator" data-key="/" aria-label="Divide">÷</button>

            <button type="button" data-key="7">7</button>
            <button type="button" data-key="8">8</button>
            <button type="button" data-key="9">9</button>
            <button type="button" class="operator" data-key="*" aria-label="Multiply">×</button>

            <button type="button" data-key="4">4</button>
            <button type="button" data-key="5">5</button>
            <button type="button" data-key="6">6</button>
            <button type="button" class="operator" data-key="-" aria-label="Subtract">−</button>

            <button type="button" data-key="1">1</button>
            <button type="button" data-key="2">2</button>
            <button type="button" data-key="3">3</button>
            <button type="button" class="operator" data-key="+" aria-label="Add">+</button>

            <button type="button" class="zero" data-key="0">0</button>
            <button type="button" data-key="." aria-label="Decimal point">.</button>
            <button type="button" class="equals" data-key="=" aria-label="Equals">=</button>
        </div>
    </main>
</body>
</html>
