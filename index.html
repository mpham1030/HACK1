<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hack 1 Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator-container">

        <h1>Hack 1 Calculator</h1>

        <div class="calculator">

            <input
                type="text"
                id="display"
                placeholder="0"
                aria-label="Calculator display"
                readonly
            >

            <div class="buttons">

                <button class="clear" data-action="clear">CLEAR</button>
                <button data-action="backspace">DEL</button>
                <button data-action="percent">%</button>
                <button class="operator" data-operator="/">÷</button>

                <button data-number="7">7</button>
                <button data-number="8">8</button>
                <button data-number="9">9</button>
                <button class="operator" data-operator="*">×</button>

                <button data-number="4">4</button>
                <button data-number="5">5</button>
                <button data-number="6">6</button>
                <button class="operator" data-operator="-">−</button>

                <button data-number="1">1</button>
                <button data-number="2">2</button>
                <button data-number="3">3</button>
                <button class="operator" data-operator="+">+</button>

                <button data-number="0" class="zero">0</button>
                <button data-number=".">.</button>
                <button class="equals" data-action="equals">=</button>

            </div>
        </div>

        <footer>
            <p>Group 2 Hack 1 | MIS 481</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
